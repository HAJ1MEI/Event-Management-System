<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Wishlist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Arial', sans-serif;
    }
    .wishlist-container {
      max-width: 900px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .header {
      background: linear-gradient(to right, tomato, magenta);
      color: white;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .wishlist-table thead {
      background-color: tomato;
      color: white;
    }
    .wishlist-table tbody tr:hover {
      background-color: rgba(255, 99, 71, 0.1);
    }
    .btn-custom {
      background: linear-gradient(45deg, tomato, magenta);
      border: none;
      color: white;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      background: magenta;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .empty-message {
      text-align: center;
      padding: 20px;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="wishlist-container">
    <div class="header">
      <h2>Your Wishlist</h2>
    </div>

    <div class="d-flex justify-content-between mb-3">
      <a href="/events" class="btn btn-secondary">← Back to Home</a>
    </div>

    <div th:if="${#lists.isEmpty(wishlist)}" class="empty-message">
      <p>You have not added any events to your wishlist yet.</p>
    </div>

    <div th:if="${!#lists.isEmpty(wishlist)}">
      <table class="table table-hover wishlist-table">
        <thead>
          <tr>
            <th>Event</th>
            <th>Description</th>
            <th>Price (₹)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="wish : ${wishlist}">
            <td th:text="${wish.event.title}"></td>
            <td th:text="${wish.event.description}"></td>
            <td th:text="${wish.event.price}"></td>
            <td class="btn-group">
              <a th:href="@{/events/details/{id}(id=${wish.event.id})}" class="btn btn-custom btn-sm">View</a>
              <a th:href="@{/wishlist/delete/{id}(id=${wish.id})}" class="btn btn-danger btn-sm"
                 onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
