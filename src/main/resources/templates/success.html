<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="6;url=/events">
  <title>Payment Successful</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
      body {
          background-color: #f8f9fa;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
      }
      .success-container {
          width: 600px;
          background: white;
          padding: 40px;
          border-radius: 10px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
          text-align: center;
      }
      .success-icon {
          font-size: 50px;
          color: #28a745;
          margin-bottom: 10px;
      }
      .btn-custom {
          background: linear-gradient(45deg, #91292c, #bf4045);
          border: none;
          color: white;
      }
      .btn-custom:hover {
          background: #bf4045;
      }
  </style>
</head>
<body>
  <div class="success-container">
      <div class="success-icon">✔</div>
      <h1 class="text-success">Payment Successful!</h1>
      <p>Your ticket has been booked successfully.</p>
      <p>You will be redirected to the homepage in <span id="countdown">5</span> seconds...</p>
      <a href="/events" class="btn btn-custom mt-3">Go to Homepage</a>
  </div>

  <script>
  let seconds = 5;
  let countdownElement = document.getElementById("countdown");
  let interval = setInterval(() => {
      seconds--;
      countdownElement.textContent = seconds;
      if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = "/events";
      }
  }, 1000);
  </script>
</body>
</html>
