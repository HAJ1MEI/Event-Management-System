<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .header {
            background: linear-gradient(to right, tomato, magenta);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .table thead {
            background-color: tomato;
            color: white;
        }
        .table tbody tr:hover {
            background-color: rgba(255, 99, 71, 0.1);
        }
        .badge {
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 5px;
        }
        .badge-confirmed {
            background-color: #28a745;
        }
        .badge-pending {
            background-color: #ffc107;
            color: black;
        }
        .badge-canceled {
            background-color: #dc3545;
        }
        .back-button {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="header">
            <h2>Your Booked Tickets</h2>
        </div>

        <!-- Back Button -->
        <div class="d-flex justify-content-between mb-3">
            <a href="/events" class="btn btn-secondary back-button">← Back to Home</a>
        </div>

        <div class="table-container">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Tickets</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.event.title}"></td>
                        <td th:text="${order.ticketCount}"></td>
                        <td th:text="'₹' + ${order.amount}"></td>
                        <td>
                            <span th:classappend="${order.status == 'Confirmed' ? 'badge-confirmed' : (order.status == 'Pending' ? 'badge-pending' : 'badge-canceled')}"
                                  class="badge"
                                  th:text="${order.status}">
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="4" class="text-center text-muted">No booked tickets found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
