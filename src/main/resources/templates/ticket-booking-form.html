<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FurnitureX | Buy Now</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 50px;
    }

    .booking-container {
      width: 500px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .header {
      background-color: tomato;
      color: white;
      padding: 12px;
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
      border-radius: 8px 8px 0 0;
    }

    .form-control {
      border-radius: 8px;
      padding: 10px;
    }

    .btn-custom {
      background-color: tomato;
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.3s ease-in-out;
    }

    .btn-custom:hover {
      background-color: #d6483b;
    }

    .back-btn {
      text-decoration: none;
      display: inline-block;
      margin-bottom: 15px;
      font-size: 1rem;
      color: #6c757d;
    }

    .back-btn:hover {
      color: #343a40;
    }
  </style>
</head>
<body>

  <div class="booking-container">
    <div class="header">Confirm Details</div>

    <a href="/events" class="back-btn">← Back to Home</a>

    <form id="bookingForm">
      <input type="hidden" name="eventId" id="eventId" th:value="${event.id}" />
      <input type="hidden" name="eventPrice" id="eventPrice" th:value="${event.price}" />
      
      <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" required />
      </div>
      
      <div class="mb-3">
        <label class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
      </div>
      
      <div class="mb-3">
        <label class="form-label">Quantity: (Max 2)</label>
        <input type="number" class="form-control" id="tickets" placeholder="Enter quantity" min=1 max=2 required onsubmit="warning()" />
      </div>

      <button type="button" class="btn btn-custom" onclick="initiatePayment()">Proceed to Payment</button>
    </form>
  </div>
  
  <script>
  	function warning(){
  		let label = document.getElementbyClass("form-control").value
  		 if(label > 2){
  			 document.write("Maximum 2 quantity allowed")
  		 }
  	}
  </script>

  <script>
    function initiatePayment() {
      let tickets = parseInt(document.getElementById("tickets").value);
      let eventPrice = parseFloat(document.getElementById("eventPrice").value);
      let amount = tickets * eventPrice; 

      fetch("/payment/create?amount=" + amount, {
        method: "POST"
      })
      .then(response => response.json())
      .then(order => {
        var options = {
          "key": "rzp_test_CeSjgPNBTT98bb",
          "amount": order.amount,
          "currency": "INR",
          "name": "Event Management",
          "description": "Ticket Payment",
          "order_id": order.id,  
          "handler": function (response) {
            let updateData = {
              order_id: order.id,
              payment_id: response.razorpay_payment_id,
              status: "Paid",
              userName: document.getElementById("name").value,
              userEmail: document.getElementById("email").value,
              ticketCount: tickets,
              amount: amount,
              eventId: document.getElementById("eventId").value
            };

            fetch("/payment/update", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(updateData)
            })
            .then(res => res.text())
            .then(data => {
              alert("Payment Successful: " + data);
              window.location.href = "/payment/success";
            })
            .catch(err => console.error("Error updating payment:", err));
          },
          "prefill": {
            "name": document.getElementById("name").value,
            "email": document.getElementById("email").value
          },
          "theme": { "color": "#d6483b" }
        };

        var rzp = new Razorpay(options);
        rzp.open();
      })
      .catch(error => console.error("Error creating order:", error));
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
