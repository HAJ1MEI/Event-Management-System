<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management System</title>
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
	
	@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

:root{
    --accent-color: #6e6457;
    --light-accent: #8d806f;
    --primary-color: #f7f7f3;
    --dark-color: #0a0a0a;

}
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    list-style: none;
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
}
        
        h1{
    		font-family: 'Cinzel', serif !important;
		}
		a{
			text-decoration: none;
		}
		.nav_links a{
    		color: var(--accent-color);
    		
		}

		i{
    		font-size: 1.5rem;
		}
		
		nav{
    max-width: 80%;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    justify-content: space-between;
    align-self: center;
    padding: 15px 100px;
    align-items: center;
    background-color: var(--accent-color);
    color: var(--dark-color);
    font-size: 1.1rem;
    /* width: 90%; */
    border-radius: 15px;
    position: relative;
    z-index: 1000;
    top: 10px;
}

input[type="text"]{
    border: none;
    padding: 10px;
    border-radius: 10px;
    margin-right: 0.5rem;
}

.nav_links{
    display: flex;
    justify-content: space-between;
    width: 35%;
    margin-left: 150px;
}
.nav_links a:hover{
    transition: 0.3s;
    color: var(--dark-color);
}

.logo{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    ;
}
.logo h1 a{
    font-family: 'Cinzel', serif;
    color: var(--dark-color);
}
        
        .carousel-item img {
            filter: brightness(70%);
            transition: 0.5s;
            border-radius: 10px;
        }
        .carousel-caption {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
        }
        .card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s;
            border-radius: 15px;
            overflow: hidden;
        }
        .card:hover {
        	cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .card:hover img{
        	transition: 0.1s ease-out;
        	scale: 1.02;
        }
        .footer {
            background-color: #91292c;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .custom-button{
        	background-color: none;
        	border: 1px solid white;
        	color: white;
        }
        .custom-button:hover{
        	background-color: white;
        }
        .btn-edit{
        	background-color: #dbd4d3;
        }
        .btn-edit:hover{
        	border: 1px solid #91292c;
        }
        
		.category-card {
			cursor: pointer;
		    height: 100%; 
		    display: flex;
		    flex-direction: column;
		    justify-content: space-between;
		    border-radius: 15px;
		    overflow: hidden;
		    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
		    transition: transform 0.2s ease-in-out, box-shadow 0.2s;
		}
		.category-card img {
		    height: 500px; 
		    object-fit: cover; 
		    width: 100%;
		}
		.category-card .card-body {
		    flex-grow: 1; 
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    text-align: center;
		    font-weight: bold;
		}
		.category-card:hover {
		    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
		}
		.card-body h4{
			padding: 10px;
			
		}
        
        
        
        
        .custom-card {
        border: none;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        cursor: pointer;
    }

    .custom-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    .card-header {
        background-color: tomato;
        color: white;
        padding: 12px;
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
    }

    .card-body {
        padding: 15px;
    }

    .price {
        font-weight: bold;
        font-size: 1.1rem;
    }

    .btn-custom {
        background-color: tomato;
        color: white;
        border: none;
        transition: background 0.3s ease-in-out;
        padding: 8px 15px;
        font-size: 0.9rem;
        border-radius: 8px;
    }

    .btn-custom:hover {
        background-color: #d6483b;
    }

    .btn-danger {
        transition: background 0.3s ease-in-out;
    }

    .btn-danger:hover {
        background-color: #b22222;
    }

    .btn-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
    }
        
    </style>
</head>
<body>
    <nav>
                <div class="logo">
                    <i class="fa-solid fa-couch" style="color: #abac6c;"></i>
                    <i class="fa-thin fa-couch"></i>
                    <h1><a href="/">FurnitureX</a></h1>
                </div>
                <div class="nav_links">
                    <a href="/events">Products</a>
                    <a href="#">About</a>
                    <a href="#">Services</a>
                    <a href="#">Contact</a>
                </div>
                <div>
                    <input type="text" placeholder="Search...">
                    <a href="#" class="btn">Login</a>
                </div>
            </nav>

    <div class="container mt-4">
        <h1 class="text-center text-danger">Recently Added Events</h1>
        <div id="eventCarousel" class="carousel slide mt-4 mb-5" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div th:each="event, iterStat : ${recentEvents}" class="carousel-item" th:classappend="${iterStat.index == 0} ? 'active'">
                    <img th:src="${event.imageUrl}" class="d-block w-100" style="height: 450px; object-fit: cover;" alt="Event Image">
                    <div class="carousel-caption d-none d-md-block">
                        <h5 th:text="${event.title}"></h5>
                        <p th:text="${event.description}"></p>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#eventCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#eventCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
        
        
        
    <!-- New Categories Carousel Section -->
<h2 class="text-center text-danger mb-4">Categories</h2>
<div id="categoryCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
  <div class="carousel-inner">
    
    <div th:each="categoryGroup, iterStat : ${categoryGroups}" class="carousel-item" th:classappend="${iterStat.index == 0} ? 'active'">
    <div class="row">
        <div th:each="cat : ${categoryGroup}" class="col-md-4 mb-3">
            <div class="category-card" th:data-category="${cat.name}" onclick="redirectToCategory(this)">
                <img th:src="${cat.imageUrl}" class="card-img-top" alt="Category Image">
                <div class="card-body">
                    <h4 class="card-text text-center" th:text="${cat.name}"></h4>
                </div>
            </div>
        </div>
    </div>
</div>
  </div>
  <!-- Category Carousel Controls -->
  <button class="carousel-control-prev" type="button" data-bs-target="#categoryCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#categoryCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

        
        

        <h1 class="mb-4 text-danger">Live Events</h1>
        <div class="row">
            <div th:each="event : ${events}" class="col-md-4 mb-4">
                <!--  <div class="card h-100" th:onclick="|window.location.href='/events/details/${event.id}'|">
                    <img th:src="${event.imageUrl}" class="card-img-top" alt="Event Image">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${event.title}"></h5>
                        <p class="card-text" th:text="${event.description}"></p>
                        <h6 class="text-muted">Price: ₹<span th:text="${event.price}"></span></h6>
                        <div th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}">
                            <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-edit">Edit</a>
                            <a th:href="@{/events/delete/{id}(id=${event.id})}" class="btn btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                        </div>
                    </div>
                </div>-->
                <div class="card custom-card h-100">
    <div class="card-header" th:text="${event.title}"></div>
    <img th:src="${event.imageUrl}" class="card-img-top" alt="Event Image">
    <div class="card-body">
        <p class="card-text" th:text="${event.description}"></p>
        <h6 class="price">Price: ₹<span th:text="${event.price}"></span></h6>

        <div class="btn-group">
            <a th:href="@{/events/book/{id}(id=${event.id})}" class="btn btn-custom">Book Now</a>
            
            <div th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}">
                <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                <a th:href="@{/events/delete/{id}(id=${event.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
            </div>
        </div>
    </div>
</div>
            </div>
        </div>
    </div>

    <footer class="footer mt-4">
        <p>&copy; 2025 Event Management System | Designed with ❤️</p>
    </footer>
	<script>
    function redirectToCategory(element) {
        const category = element.getAttribute("data-category");
        window.location.href = "/events?category=" + encodeURIComponent(category);
    }
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
